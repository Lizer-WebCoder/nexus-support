name: Densify galaxy stars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/densify-stars.yml'
      - 'scripts/densify_stars.py'
jobs:
  densify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run densify script
        run: |
          set -e
          python3 scripts/densify_stars.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          git status
          git commit -m "Login: denser galaxy starfield (180 particles, 4 depth layers)" || echo nochange
          git push origin HEAD:main
