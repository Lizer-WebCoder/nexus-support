name: Assemble CP
on:
  push:
    paths:
      - scripts/assemble_cp.py
      - scripts/cpb0.txt
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/assemble_cp.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/CustomerPortal.tsx
          git commit -m "fix: restore full CustomerPortal features" || exit 0
          git push
