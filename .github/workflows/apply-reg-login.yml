name: Apply registration LoginPage on kirzhian
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kirzhian
      - name: Apply registration card + Show + Forgot Password
        run: |
          python3 scripts/apply_reg_card.py
          echo "--- after apply ---"
          grep -c "Create your account\|Forgot Password\|confirmPassword\|handleForgotPassword" src/components/LoginPage.tsx || true
          wc -c src/components/LoginPage.tsx
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Apply separate registration card, visible Show, Forgot Password"
          git push origin kirzhian
