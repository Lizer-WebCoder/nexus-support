name: Fix portal UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-portal-ui.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore CustomerPortal, patch sidebar, write CSS
        run: |
          set -e
          git checkout e973f0632f202e8dc0dabbbc65a8be25600c23f9 -- src/components/CustomerPortal.tsx
          python3 << 'PY'
          from pathlib import Path
          import base64
          p = Path('src/components/CustomerPortal.tsx')
          t = p.read_text()
          t = t.replace(
            'hidden md:flex w-60 shrink-0 bg-zinc-950 text-zinc-100 flex-col border-r border-zinc-800 relative z-30',
            'portal-sidebar hidden md:flex w-60 shrink-0 flex-col relative z-30',
            1,
          )
          t = t.replace(
            'px-4 py-5 flex items-center gap-3 border-b border-zinc-800/80',
            'portal-sidebar-header px-4 py-5 flex items-center gap-3',
            1,
          )
          t = t.replace(
            'text-sm font-semibold tracking-tight">Nexus Ops',
            'text-sm font-semibold tracking-tight portal-sidebar-title">Nexus Ops',
            1,
          )
          t = t.replace(
            'text-[11px] text-zinc-500">Customer portal',
            'text-[11px] portal-sidebar-sub">Customer portal',
            1,
          )
          t = t.replace(
            'text-[10px] font-semibold uppercase tracking-wider text-zinc-600">Support',
            'text-[10px] font-semibold uppercase tracking-wider portal-sidebar-label">Support',
            1,
          )
          t = t.replace(
            'p-3 border-t border-zinc-800/80 space-y-1',
            'portal-sidebar-footer p-3 space-y-1',
            1,
          )
          old_btn = """                className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${\n                  active ? 'bg-brand-600/20 text-white' : 'text-zinc-400 hover:bg-white/5 hover:text-zinc-200'\n                }`}\n              >\n                <Icon size={18} className=\"shrink-0\" />"""
          new_btn = """                className={`portal-nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${\n                  active ? 'portal-nav-active' : ''\n                }`}\n              >\n                <Icon size={18} className={`shrink-0 ${\n                  ({ home: 'text-violet-400', community: 'text-sky-400', submit: 'text-amber-400', chat: 'text-fuchsia-400', track: 'text-emerald-400', mytickets: 'text-blue-400', help: 'text-indigo-400', account: 'text-pink-400' } as Record<string, string>)[item.id] || 'text-violet-400'\n                }`} />"""
          if old_btn not in t:
              raise SystemExit('nav button block not found')
          t = t.replace(old_btn, new_btn, 1)
          p.write_text(t)
          print('CustomerPortal OK', 'portal-sidebar' in t)
          b64 = Path('scripts/portal-lounge.css.b64').read_text().strip()
          Path('src/portal-lounge.css').write_bytes(base64.b64decode(b64))
          print('CSS size', Path('src/portal-lounge.css').stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx src/portal-lounge.css
          git status
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix(portal): theme-aware sidebar, colored icons, login-style comets" && git push)
