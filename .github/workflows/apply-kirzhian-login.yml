name: Apply registration card on kirzhian
on:
  workflow_dispatch:
  push:
    branches: [kirzhian]
    paths:
      - 'scripts/apply_reg_card.py'
      - 'scripts/registration_card_snippet.tsx'
      - 'scripts/patch_auth_reset.py'
      - '.github/workflows/apply-kirzhian-login.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kirzhian
          fetch-depth: 0
      - name: Restore Auth from main if truncated + apply patches
        run: |
          set -e
          SIZE=$(wc -c < src/context/AuthContext.tsx || echo 0)
          if [ "$SIZE" -lt 5000 ]; then
            git fetch origin main || true
            git show origin/main:src/context/AuthContext.tsx > src/context/AuthContext.tsx
            echo "Restored AuthContext from main"
          fi
          python3 scripts/patch_auth_reset.py
          python3 scripts/apply_reg_card.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/components/LoginPage.tsx
          git status
          git commit -m "Login: separate registration card, visible Show, Forgot Password" || echo nochange
          git push origin HEAD:kirzhian
