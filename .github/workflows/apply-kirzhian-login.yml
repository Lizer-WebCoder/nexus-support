name: Apply login card to kirzhian
on:
  workflow_dispatch:
  push:
    branches: [kirzhian]
    paths:
      - 'scripts/kirzhian_payload/**'
      - '.github/workflows/apply-kirzhian-login.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/kirzhian'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kirzhian
      - name: Reconstruct files from payload
        run: |
          set -e
          python3 scripts/restore_kirzhian_login.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/components/LoginPage.tsx
          git status
          git commit -m "Login: separate registration card, visible Show, Forgot Password" || echo nochange
          git push origin HEAD:kirzhian
