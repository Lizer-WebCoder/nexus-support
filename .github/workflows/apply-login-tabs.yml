name: Apply Login Tabs Patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and run embedded patcher
        run: |
          python3 << 'EOF'
          import gzip, base64
          from pathlib import Path
          b64 = Path('scripts/patch-data/wf.b64gz').read_text().strip()
          text = gzip.decompress(base64.b64decode(b64)).decode()
          start = text.index("python3 << 'PATCH_EOF'\n") + len("python3 << 'PATCH_EOF'\n")
          end = text.index("\nPATCH_EOF\n")
          Path('/tmp/apply_login_tabs_patch.py').write_text(text[start:end])
          print('extracted patcher', end - start, 'bytes')
          EOF
          python3 /tmp/apply_login_tabs_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/components/LoginPage.tsx src/components/UsersAdminPage.tsx
          git status
          git commit -m "Login: Agent/Customer tabs, Create account for both, dual approval" || echo "no changes"
          git push origin HEAD:main
