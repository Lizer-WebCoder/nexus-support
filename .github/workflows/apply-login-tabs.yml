name: Apply Login Tabs Patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore LoginPage + denser upward stars
        run: |
          python3 << 'EOF'
          import urllib.request
          from pathlib import Path

          url = 'https://raw.githubusercontent.com/Right-Click-V4/nexus-support/6397b51e0e0cfcb6bb9f110e892b605f3f52cf79/src/components/LoginPage.tsx'
          text = urllib.request.urlopen(url).read().decode()
          text = text.replace('useFallingStars(28)', 'useFallingStars(90)')
          old = """function useFallingStars(count: number) {
  return useMemo(
    () =>
      Array.from({ length: count }, (_, i) => ({
        id: i,
        left: `${(i * 41 + 13) % 100}%`,
        size: i % 5 === 0 ? 3 : i % 3 === 0 ? 2 : 1,
        delay: -((i * 0.37) % 20),
        duration: 8 + (i % 11) * 1.4,
        color: i % 4 === 0 ? '#ff66cc' : i % 3 === 0 ? '#66f0ff' : '#c4b5fd',
        opacity: 0.35 + (i % 6) * 0.1,
      })),
    [count]
  );
}"""
          new = """function useFallingStars(count: number) {
  return useMemo(
    () =>
      Array.from({ length: count }, (_, i) => {
        const layer = i % 3;
        const size =
          layer === 0 ? 1 : layer === 1 ? (i % 4 === 0 ? 2 : 1.5) : i % 5 === 0 ? 3.5 : 2;
        const duration =
          layer === 0
            ? 18 + (i % 9) * 2.2
            : layer === 1
              ? 12 + (i % 8) * 1.6
              : 7 + (i % 7) * 1.2;
        const colors = ['#c4b5fd', '#a78bfa', '#66f0ff', '#ff66cc', '#e9d5ff', '#f0abfc', '#93c5fd'];
        return {
          id: i,
          left: `${(i * 37 + 11 + layer * 7) % 100}%`,
          size,
          delay: -((i * 0.29 + layer * 1.7) % (duration * 0.9)),
          duration,
          color: colors[i % colors.length],
          opacity: layer === 0 ? 0.2 + (i % 5) * 0.06 : 0.35 + (i % 6) * 0.1,
          blur: layer === 0 ? 0.6 : 0,
        };
      }),
    [count]
  );
}"""
          if old in text:
              text = text.replace(old, new)
          old_map = "style={{ left: s.left, width: s.size, height: s.size, background: s.color, opacity: s.opacity, boxShadow: `0 0 ${s.size * 3}px ${s.color}`, animationDelay: `${s.delay}s`, animationDuration: `${s.duration}s` }}"
          new_map = "style={{ left: s.left, width: s.size, height: s.size, background: s.color, opacity: s.opacity, boxShadow: `0 0 ${s.size * 4}px ${s.color}, 0 0 ${s.size * 8}px ${s.color}55`, filter: s.blur ? `blur(${s.blur}px)` : undefined, animationDelay: `${s.delay}s`, animationDuration: `${s.duration}s` }}"
          text = text.replace(old_map, new_map)
          Path('src/components/LoginPage.tsx').write_text(text)
          print('LoginPage', len(text), 'stars90', 'useFallingStars(90)' in text)

          css = Path('src/index.css').read_text()
          old_css = """.login-star {
  top: 110%;
  animation-name: login-star-rise;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes login-star-rise {
  from { transform: translateY(0) scale(0.6); opacity: 0; }
  10% { opacity: 0.9; }
  85% { opacity: 0.55; }
  to { transform: translateY(-130vh) scale(1); opacity: 0; }
}"""
          new_css = """.login-star {
  top: 110%;
  will-change: transform, opacity;
  animation-name: login-star-rise;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.login-starfield {
  pointer-events: none;
}

@keyframes login-star-rise {
  from { transform: translate3d(0, 0, 0) scale(0.55); opacity: 0; }
  8% { opacity: 0.95; }
  50% { opacity: 0.75; }
  88% { opacity: 0.4; }
  to { transform: translate3d(0, -135vh, 0) scale(1.05); opacity: 0; }
}"""
          if old_css in css:
              Path('src/index.css').write_text(css.replace(old_css, new_css))
              print('CSS updated')
          else:
              print('CSS pattern not found')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx src/index.css
          git status
          git commit -m "Login: denser upward galaxy starfield (90 particles, 3 layers)" || echo "no changes"
          git push origin HEAD:main
