name: Apply Login Tabs Patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and run patcher
        run: |
          cat scripts/patch_parts/part0.pyfrag scripts/patch_parts/part1.pyfrag scripts/patch_parts/part2.pyfrag scripts/patch_parts/part3.pyfrag > scripts/apply_login_tabs_patch.py
          python3 scripts/apply_login_tabs_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/components/LoginPage.tsx src/components/UsersAdminPage.tsx
          git status
          git commit -m "Login: Agent/Customer tabs, Create account for both, dual approval" || echo "no changes"
          git push origin HEAD:main
