name: Strip desert CSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/strip-desert.css.yml'
jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "/@import '\.\/portal-desert.css';/d" src/index.css
          if ! grep -q portal-glass-card src/index.css; then
            cat >> src/index.css << 'EOF'

/* Portal cards */
.portal-glass-card {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid #e4e4e7;
  box-shadow: 0 4px 16px rgba(24, 24, 27, 0.05);
}
html.nexus-dark .portal-glass-card {
  background: rgba(24, 24, 27, 0.85);
  border-color: #3f3f46;
}
EOF
          fi
          grep -n portal-desert src/index.css || echo "desert import gone"
          git config user.name "nexus-bot"
          git config user.email "bot@nexus.ops"
          git add src/index.css
          git commit -m "Remove desert CSS import from index.css" || true
          git push
