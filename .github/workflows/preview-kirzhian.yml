name: Preview kirzhian
on:
  workflow_dispatch:
  push:
    branches:
      - kirzhian

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-preview-kirzhian
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kirzhian
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Set Vite base to /nexus-support/preview/
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          t = p.read_text()
          # Force base for this preview build only
          t = t.replace(
              "const base =\n  process.env.GITHUB_ACTIONS === 'true' || process.env.FORCE_GH_PAGES_BASE === 'true'\n    ? '/nexus-support/'\n    : '/'",
              "const base = '/nexus-support/preview/'",
          )
          if "'/nexus-support/preview/'" not in t:
              # Fallback: simple replace of the production base string
              t = t.replace("'/nexus-support/'", "'/nexus-support/preview/'")
          p.write_text(t)
          print(p.read_text())
          PY

      - name: Build
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch dist/.nojekyll
          echo "--- dist/index.html ---"
          cat dist/index.html

      - name: Publish preview/ on gh-pages (production root untouched)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin gh-pages --depth=1
          git checkout -f origin/gh-pages
          git checkout -B gh-pages

          rm -rf preview
          mkdir -p preview
          cp -a ../dist/. preview/
          touch .nojekyll

          echo "--- preview/index.html ---"
          cat preview/index.html

          git add -A
          git status
          git commit -m "preview kirzhian ${GITHUB_SHA}" || echo "No changes"
          git push -f origin HEAD:gh-pages
          echo "Preview: https://right-click-v4.github.io/nexus-support/preview/"
