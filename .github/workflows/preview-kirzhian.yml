name: Preview kirzhian
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-preview-kirzhian
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kirzhian
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with preview base path
        env:
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Temporary base for preview subfolder
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('vite.config.ts','utf8');
            c = c.replace(\"/nexus-support/\", \"/nexus-support/preview/\");
            fs.writeFileSync('vite.config.ts', c);
            console.log('base set to /nexus-support/preview/');
          "
          npm run build
          touch dist/.nojekyll

      - name: Publish preview folder on gh-pages (keep production root)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch current gh-pages so we don't wipe production
          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout -f origin/gh-pages
            git checkout -B gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Replace only the preview/ folder
          rm -rf preview
          mkdir -p preview
          cp -a ../dist/. preview/
          touch .nojekyll

          git add -A
          git commit -m "preview kirzhian ${GITHUB_SHA}" || echo "No changes"
          git push -f origin HEAD:gh-pages
          echo "Preview URL: https://right-click-v4.github.io/nexus-support/preview/"
