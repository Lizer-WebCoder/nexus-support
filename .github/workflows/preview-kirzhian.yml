name: Preview kirzhian
on:
  workflow_dispatch:
  push:
    branches:
      - kirzhian

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-preview-kirzhian
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kirzhian
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Force Vite base /nexus-support/preview/
        run: |
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            base: '/nexus-support/preview/',
          })
          EOF
          cat vite.config.ts

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch dist/.nojekyll
          echo "--- dist/index.html ---"
          cat dist/index.html
          grep -q '/nexus-support/preview/assets/' dist/index.html || (echo "BASE PATH WRONG" && exit 1)

      - name: Publish preview/ on gh-pages (production root untouched)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin gh-pages --depth=1
          git checkout -f origin/gh-pages
          git checkout -B gh-pages

          rm -rf preview
          mkdir -p preview
          cp -a ../dist/. preview/
          touch .nojekyll

          echo "--- preview/index.html ---"
          cat preview/index.html

          git add -A
          git commit -m "preview kirzhian ${GITHUB_SHA}" || echo "No changes"
          git push -f origin HEAD:gh-pages
          echo "Preview: https://right-click-v4.github.io/nexus-support/preview/"
