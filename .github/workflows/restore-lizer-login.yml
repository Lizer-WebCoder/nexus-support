name: Restore Lizer LoginPage on main
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/restore_lizer_login.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "Restore Lizer Login UI on main; keep post-login ceremony only"
          git push origin HEAD:main
