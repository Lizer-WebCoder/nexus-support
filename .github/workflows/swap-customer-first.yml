name: Customer tab first on kirzhian
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian
          fetch-depth: 0

      - name: Swap tabs Customer first
        run: |
          python3 scripts/swap_customer_first.py

      - name: Commit and push to kirzhian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Login: Customer tab first (left), default Customer, Agent on right"
          git push origin HEAD:kirzhian
