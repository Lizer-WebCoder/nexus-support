name: Restore galaxy LoginPage
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write LoginPage
        run: |
          python3 << 'EOF'
          import base64, gzip
          from pathlib import Path
          parts = [
            "",
          ]
          raw = gzip.decompress(base64.b64decode("".join(parts)))
          Path("src/components/LoginPage.tsx").write_bytes(raw)
          print("wrote", len(raw), "bytes")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          git diff --staged --quiet || git commit -m "Login: denser galaxy starfield (180 particles, 4 depth layers) + full restore"
          git push
