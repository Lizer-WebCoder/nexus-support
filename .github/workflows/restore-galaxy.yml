name: Densify stars
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-galaxy.yml'
jobs:
  densify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump star count and layer generator
        run: |
          set -e
          FILE=src/components/LoginPage.tsx
          test -f "$FILE"
          grep -q useFallingStars "$FILE"
          # bump any count to 180
          sed -i 's/useFallingStars([0-9]*)/useFallingStars(180)/' "$FILE"
          # enrich boxShadow if simple form present
          sed -i 's/boxShadow: `0 0 ${s.size \* 3}px ${s.color}`/boxShadow: `0 0 ${s.size * 4}px ${s.color}, 0 0 ${s.size * 8}px ${s.color}55`/' "$FILE" || true
          grep -n 'useFallingStars(180)' "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --staged --stat
          git commit -m "Login: more upward galaxy particles (180)" || echo nochange
          git push
