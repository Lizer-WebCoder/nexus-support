name: Restore CP script
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-cp-script.yml"
      - "scripts/restore_cp.sh"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run restore script
        run: bash scripts/restore_cp.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CustomerPortal.tsx src/portal-lounge.css
          git status
          git commit -m "fix(portal): restore CustomerPortal + glass sidebar + cyan comets" || exit 0
          git push
