name: Add login card glow on kirzhian
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian
          fetch-depth: 0
      - run: python3 scripts/add_card_glow.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Login: soft violet-fuchsia glow around login and registration cards"
          git push origin HEAD:kirzhian
