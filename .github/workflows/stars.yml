name: Denser Stars
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increase upward galaxy particles
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('src/components/LoginPage.tsx')
          t = p.read_text()
          t2 = t.replace('useFallingStars(42)', 'useFallingStars(96)')
          t2 = t2.replace('useFallingStars(28)', 'useFallingStars(96)')
          if t2 == t:
              print('count already updated or pattern missing')
          else:
              p.write_text(t2)
              print('count -> 96')
          "
          # Expand particle generator for 3 depth layers
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/LoginPage.tsx')
          t = p.read_text()
          old = """      Array.from({ length: count }, (_, i) => ({
        id: i,
        left: \`${(i * 41 + 13) % 100}%\`,
        size: i % 5 === 0 ? 3 : i % 3 === 0 ? 2 : 1,
        delay: -((i * 0.37) % 20),
        duration: 8 + (i % 11) * 1.4,
        color: i % 4 === 0 ? '#ff66cc' : i % 3 === 0 ? '#66f0ff' : '#c4b5fd',
        opacity: 0.35 + (i % 6) * 0.1,
      })),"""
          new = """      Array.from({ length: count }, (_, i) => {
        const layer = i % 3;
        const size = layer === 0 ? 1 : layer === 1 ? (i % 4 === 0 ? 2 : 1.5) : i % 5 === 0 ? 3.5 : 2;
        const duration = layer === 0 ? 18 + (i % 9) * 2.2 : layer === 1 ? 12 + (i % 8) * 1.6 : 7 + (i % 7) * 1.2;
        const colors = ['#c4b5fd', '#a78bfa', '#66f0ff', '#ff66cc', '#e9d5ff', '#f0abfc', '#93c5fd'];
        return {
          id: i,
          left: \`${(i * 37 + 11 + layer * 7) % 100}%\`,
          size,
          delay: -((i * 0.29 + layer * 1.7) % (duration * 0.9)),
          duration,
          color: colors[i % colors.length],
          opacity: layer === 0 ? 0.2 + (i % 5) * 0.06 : 0.35 + (i % 6) * 0.1,
          blur: layer === 0 ? 0.6 : 0,
        };
      }),"""
          if old in t:
              t = t.replace(old, new)
              print('generator expanded')
          else:
              print('generator pattern missing')
          old_s = 'boxShadow: \`0 0 ${s.size * 3}px ${s.color}\`'
          new_s = 'boxShadow: \`0 0 ${s.size * 4}px ${s.color}, 0 0 ${s.size * 8}px ${s.color}55\`, filter: s.blur ? \`blur(${s.blur}px)\` : undefined'
          if old_s in t:
              t = t.replace(old_s, new_s)
              print('glow updated')
          p.write_text(t)
          print('done', 'useFallingStars(96)' in t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          git commit -m "Login: denser upward galaxy particles (96, 3 layers)" || echo no-change
          git push origin HEAD:main
