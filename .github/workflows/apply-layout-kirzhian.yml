name: Apply wide layout to kirzhian
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: kirzhian
          fetch-depth: 0

      - name: Restore full CSS from main then patch glass
        run: |
          git fetch origin main
          git show origin/main:src/index.css > src/index.css
          python3 scripts/patch_glass_css.py
          wc -c src/index.css

      - name: Apply wide-monitor login layout
        run: |
          python3 scripts/fix_wide_layout.py
          grep -n "max-w-\[1600px\]\|max-w-\[360px\]" src/components/LoginPage.tsx | head -5

      - name: Commit and push to kirzhian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/components/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Login: ultra-wide left/right layout, narrower transparent cards"
          git push origin HEAD:kirzhian
