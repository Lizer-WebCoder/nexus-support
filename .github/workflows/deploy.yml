name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          # Force GitHub Pages base path so assets resolve under /nexus-support/
          GITHUB_ACTIONS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npx vite build
          # Safety: ensure index references hashed assets, not /src/main.tsx
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points at source main.tsx"
            cat dist/index.html
            exit 1
          fi
          echo "Built index.html:"
          cat dist/index.html

      # Classic reliable deploy: push dist → gh-pages branch
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # Also upload for repos that use Pages source = GitHub Actions
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4
