name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Restore full CustomerPortal if needed
        run: |
          set -e
          if ! grep -q PortalLiveChat src/components/CustomerPortal.tsx 2>/dev/null; then
            echo "Restoring full CustomerPortal from e973..."
            curl -fsSL "https://raw.githubusercontent.com/Right-Click-V4/nexus-support/e973f0632f202e8dc0dabbbc65a8be25600c23f9/src/components/CustomerPortal.tsx" -o src/components/CustomerPortal.tsx
            python3 -c "
from pathlib import Path
t = Path('src/components/CustomerPortal.tsx').read_text()
t = t.replace(
  'hidden md:flex w-60 shrink-0 bg-zinc-950 text-zinc-100 flex-col border-r border-zinc-800 relative z-30',
  'portal-sidebar hidden md:flex w-60 shrink-0 flex-col relative z-30', 1)
t = t.replace(
  'px-4 py-5 flex items-center gap-3 border-b border-zinc-800/80',
  'portal-sidebar-header px-4 py-5 flex items-center gap-3', 1)
t = t.replace(
  'text-sm font-semibold tracking-tight\">Nexus Ops',
  'text-sm font-semibold tracking-tight portal-sidebar-title\">Nexus Ops', 1)
t = t.replace(
  'text-[11px] text-zinc-500\">Customer portal',
  'text-[11px] portal-sidebar-sub\">Customer portal', 1)
t = t.replace(
  'text-[10px] font-semibold uppercase tracking-wider text-zinc-600\">Support',
  'text-[10px] font-semibold uppercase tracking-wider portal-sidebar-label\">Support', 1)
t = t.replace(
  'p-3 border-t border-zinc-800/80 space-y-1',
  'portal-sidebar-footer p-3 space-y-1', 1)
t = t.replace(
  \"active ? 'bg-brand-600/20 text-white' : 'text-zinc-400 hover:bg-white/5 hover:text-zinc-200'\",
  \"active ? 'portal-nav-active' : 'portal-nav-item'\", 1)
t = t.replace(
  '<Icon size={18} className=\"shrink-0\" />',
  '<Icon size={18} className={`shrink-0 ${({ home: \"text-violet-400\", community: \"text-sky-400\", submit: \"text-amber-400\", chat: \"text-fuchsia-400\", track: \"text-emerald-400\", mytickets: \"text-blue-400\", help: \"text-indigo-400\", account: \"text-pink-400\" } as Record<string, string>)[item.id] || \"text-violet-400\"}`} />', 1)
Path('src/components/CustomerPortal.tsx').write_text(t)
print('patched', 'PortalLiveChat' in t, 'portal-sidebar' in t)
"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CustomerPortal.tsx
            git commit -m "fix: restore full CustomerPortal features" || true
            git push || true
          else
            echo "CustomerPortal already has features"
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages (keep existing preview/)
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf work-gh-pages
          mkdir work-gh-pages
          cd work-gh-pages
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch origin gh-pages --depth=1 && git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout -f origin/gh-pages
            git checkout -B gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name preview ! -name '.git' -exec rm -rf {} +
          else
            git checkout --orphan gh-pages
          fi

          cp -a ../dist/. .
          touch .nojekyll

          git add -A
          git commit -m "deploy ${GITHUB_SHA}" || echo "No changes"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Pushed to gh-pages (preview/ preserved if present)"
